name: E2E mobil personel testi
on:
  push:
    branches: [e2e-test]
permissions:
  contents: write
jobs:
  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Installer indir (yayindaki gercek surum)
        shell: pwsh
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh release download v100.0.2 -R ErolEmirhan/DROJE-ADISYON -p "DROJE-POS-Setup-100.0.2.exe" -D inst
      - name: Sessiz kurulum
        shell: pwsh
        run: |
          Start-Process -FilePath "inst\DROJE-POS-Setup-100.0.2.exe" -ArgumentList "/S" -Wait
          Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "DROJE POS.exe" -ErrorAction SilentlyContinue | Select-Object FullName
          Get-ChildItem "C:\Program Files" -Recurse -Depth 2 -Filter "DROJE POS.exe" -ErrorAction SilentlyContinue | Select-Object FullName
      - name: Test verisi (sifre SAYI olarak kayitli personel)
        shell: pwsh
        run: |
          $db = '{"staff":[{"id":1,"name":"Test","surname":"Garson","password":1234,"is_manager":false},{"id":2,"name":"Bosluk","surname":"Sifre","password":" 5555 ","is_manager":false}],"categories":[{"id":1,"name":"Doner","order_index":0}],"products":[{"id":1,"name":"Et Doner","category_id":1,"price":200}],"sales":[],"saleItems":[],"tableOrders":[],"tableOrderItems":[],"settings":{}}'
          foreach ($d in @("$env:APPDATA\DROJE POS","$env:APPDATA\droje-pos")) { New-Item -ItemType Directory -Force -Path $d | Out-Null; Set-Content -Path "$d\makara-db.json" -Value $db -Encoding utf8 }
      - name: Sahte VPN adaptoru ekle (eski hatayi tetikleyen durum)
        shell: pwsh
        continue-on-error: true
        run: |
          New-NetAdapter -Name "Hamachi" -ErrorAction SilentlyContinue
          Get-NetIPAddress -AddressFamily IPv4 | Format-Table InterfaceAlias,IPAddress
      - run: npm i puppeteer-core@22 --no-save --no-audit --no-fund
      - name: Uygulamayi baslat ve test et (ayni adimda, yoksa runner sureci oldurur)
        shell: pwsh
        run: |
          $exe = (Get-ChildItem "$env:LOCALAPPDATA\Programs","C:\Program Files" -Recurse -Depth 3 -Filter "DROJE POS.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          Write-Host "EXE: $exe"
          Start-Process -FilePath $exe -RedirectStandardOutput app-out.txt -RedirectStandardError app-err.txt
          Start-Sleep -Seconds 25
          node test.js
      - name: Sonuclari yayinla
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force results | Out-Null
          Copy-Item app-out.txt,app-err.txt,result.txt,*.png results -ErrorAction SilentlyContinue
          Get-Content results\result.txt -ErrorAction SilentlyContinue
          git config user.name "e2e"; git config user.email "e2e@users.noreply.github.com"
          git checkout --orphan e2e-results
          git rm -rf --cached . | Out-Null
          git add -f results
          git commit -m "e2e results $env:GITHUB_RUN_ID"
          git push -f origin e2e-results
